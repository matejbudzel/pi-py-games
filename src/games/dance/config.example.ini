[game]
title = Tancuj, tancuj, vykrúcaj!
# Persistent rotating tracebacks and connection events (three 1 MB files).
error_log = ~/.local/state/pi-dance/errors.log

[songs]
directory = songs

[display]
# Use fbdev on the Pi 1's legacy /dev/fb0 setup; leave pygame on desktop.
backend = pygame
framebuffer = /dev/fb0
# Optional TV standby detection; requires cec-client and TV HDMI-CEC support.
cec = false

[exit]
item_title = Koniec
confirmation_text = Naozaj skončiť?
confirm_button = Áno
cancel_button = Nie

[gameplay]
pause_text = Pauza
exit_confirmation_text = Prestať tancovať?
exit_confirm_button = Áno
exit_cancel_button = Nie
timing_offset_ms = 0
