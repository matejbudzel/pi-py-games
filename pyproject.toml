[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-py-games"
version = "0.1.0"
description = "Small mat-first retro-style Pygame games for Raspberry Pi 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pygame>=2.5,<3",
]

[project.scripts]
pi-dance = "games.dance.main:main"
pi-2048 = "games.twenty48.main:main"
pi-py-games = "pi_py_games.provider:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"games.dance" = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/gameplay/*.png", "assets/gameplay/*.bmp", "*.ini"]
